[[mgr.prepend_keymap]]
on   = "!"
for  = "unix"
run  = 'shell "$SHELL" --block'
desc = "Open $SHELL here"

[[mgr.prepend_keymap]]
on   = "q"
run  = "quit --no-cwd-file"
desc = "Quit the process without outputting cwd-file"

[[mgr.prepend_keymap]]
on   = "Q"
run  = "quit"
desc = "Quit the process"

[[mgr.prepend_keymap]]
on   = "<C-q>"
run  = "quit"
desc = "shortcut to quit"
