[keys.normal]
# see https://github.com/helix-editor/helix/discussions/12934
C-y = [
  ':sh rm -f /tmp/unique-file',
  ':insert-output yazi "%{buffer_name}" --chooser-file=/tmp/unique-file',
  ':sh printf "\x1b[?1049h\x1b[?2004h" > /dev/tty',
  ':open %sh{cat /tmp/unique-file}',
  ':redraw',
]
C-r = ":reload-all"
#C-s = ":w" # Maps Ctrl-s to the typable command :w which is an alias for :write (save file)
C-x = [":wa", ":x"]
C-q = ":q"
C-S-q = ":q!"
C-backspace  = "delete_word_backward"
C-left       = "move_prev_word_start"
C-right      = ["move_next_word_start", "extend_char_right"]

#C-d = ["move_prev_word_start", "move_next_word_end", "search_selection", "extend_search_next"]

S-g = "goto_last_line"
"#" = "toggle_comments"
#C-S-left = "extend_word_left"
#C-S-right = "extend_word_right"
S-left = "extend_char_left"
S-right = "extend_char_right"
S-up = "extend_line_up"
S-down = "extend_line_down"
C-right= "goto_next_buffer"
C-left= "goto_previous_buffer"


# https://www.reddit.com/r/HelixEditor/comments/1jdmfke/lazygit_open_file_in_helix_when_pressing_e/
C-g = [
    ":write-all",
    ":new",
    ":insert-output lazygit",
    ":buffer-close!",
    ":redraw",
    ":reload-all"
]
C-p = [":sh git pull", ":reload-all"]

# https://www.reddit.com/r/HelixEditor/comments/17tjcb2/add_next_occurence_of_current_word_to_the/
# make sure there is only one selection, select word under cursor, set search to selection, then switch to select mode
C-d = ["keep_primary_selection", "move_prev_word_start", "move_next_word_end", "search_selection", "select_mode"]

[keys.select]
# if already in select mode, just add new selection at next occurrence
C-d = ["search_selection", "extend_search_next"]

C-left = "move_prev_word_start"
C-right = "move_next_word_end"
C-S-left = "move_prev_long_word_start"
C-S-right = "move_next_long_word_end"

[keys.insert]
C-x = ["normal_mode", ":wa", ":x"]
C-q = ["normal_mode", ":q"]
C-S-q = ["normal_mode", ":q!"]
C-space = "completion"
C-backspace  = "delete_word_backward"
C-left       = "move_prev_word_start"
C-right      = ["move_next_word_start", "extend_char_right"]
C-del        = "delete_word_forward"
C-end        = "goto_file_end"
C-home       = "goto_file_start"
C-S-left = "move_prev_long_word_start"
C-S-right = "move_next_long_word_end"

# https://docs.helix-editor.com/editor.html#editorauto-save-section
[editor.auto-save]
focus-lost = true # not sure if this works, depends on terminal
#after-delay.enable = true
#after-delay.timeout = 3000 # default

[editor]
trim-final-newlines      = true
trim-trailing-whitespace = true
color-modes = true
bufferline = "always"


[editor.cursor-shape]
insert = "bar"
#insert = "block"
normal = "block"
select = "underline"

[editor.statusline]
# left = ["mode", "spinner"]
# center = ["file-name"]
# right = ["diagnostics", "selections", "position"]

# Force descriptive mode text instead of letters
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"
